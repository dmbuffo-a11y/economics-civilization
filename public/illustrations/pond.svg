<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img">
  <defs>
    <linearGradient id="skyW" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e6f0f8"/>
      <stop offset="100%" stop-color="#cfe3ef"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bfd9ee"/>
      <stop offset="100%" stop-color="#86b6d6"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#skyW)"/>
  <!-- far trees -->
  <g fill="#5b8a64" opacity="0.7">
    <polygon points="40,300 80,180 120,300"/>
    <polygon points="120,310 150,210 180,310"/>
    <polygon points="620,300 660,190 700,300"/>
    <polygon points="700,310 730,220 760,310"/>
    <polygon points="200,300 230,220 260,300"/>
  </g>
  <rect x="0" y="300" width="800" height="30" fill="#5b8a64" opacity="0.35"/>
  <!-- pond -->
  <path d="M0 330 L800 330 L800 430 L0 430 Z" fill="url(#water)"/>
  <!-- reflection stripes -->
  <g stroke="#fbfaf6" stroke-opacity="0.35">
    <line x1="60" y1="360" x2="180" y2="360"/>
    <line x1="220" y1="380" x2="310" y2="380"/>
    <line x1="360" y1="360" x2="470" y2="360"/>
    <line x1="520" y1="400" x2="620" y2="400"/>
    <line x1="640" y1="370" x2="760" y2="370"/>
  </g>
  <!-- ground and beach -->
  <rect x="0" y="430" width="800" height="70" fill="#e9d9b8"/>
  <!-- pier -->
  <rect x="340" y="330" width="120" height="12" fill="#c9a57a"/>
  <rect x="340" y="342" width="120" height="4" fill="#8a6a45"/>
  <rect x="344" y="346" width="6" height="24" fill="#8a6a45"/>
  <rect x="450" y="346" width="6" height="24" fill="#8a6a45"/>
  <!-- small boat -->
  <g transform="translate(580 360)">
    <path d="M0 10 Q 30 30 60 10 Z" fill="#1f3a56"/>
    <rect x="28" y="-10" width="4" height="20" fill="#1f3a56"/>
  </g>
</svg>
