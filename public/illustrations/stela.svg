<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img">
  <defs>
    <linearGradient id="skyS" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e6f0f8"/>
      <stop offset="100%" stop-color="#bfd9ee"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#skyS)"/>
  <!-- distant trees -->
  <g fill="#5b8a64" opacity="0.45">
    <circle cx="80" cy="360" r="50"/>
    <circle cx="140" cy="370" r="40"/>
    <circle cx="660" cy="360" r="50"/>
    <circle cx="720" cy="370" r="42"/>
  </g>
  <!-- ground -->
  <rect x="0" y="380" width="800" height="120" fill="#e9e3d6"/>
  <!-- path -->
  <polygon points="300,500 500,500 460,400 340,400" fill="#f4f1ea"/>
  <!-- pedestal -->
  <rect x="360" y="300" width="80" height="110" fill="#e9e3d6" stroke="#0f1d2e" stroke-opacity="0.15"/>
  <rect x="354" y="292" width="92" height="10" fill="#d3c9b5"/>
  <!-- column -->
  <rect x="388" y="170" width="24" height="130" fill="#1f3a56"/>
  <!-- aircraft model on top -->
  <g transform="translate(318 130)">
    <path d="M0 30 L180 20 L170 38 L90 42 L74 60 L60 60 L76 42 Z" fill="#0f1d2e"/>
    <rect x="76" y="22" width="8" height="16" fill="#0f1d2e"/>
    <circle cx="176" cy="16" r="3" fill="#4d9bd4"/>
  </g>
  <!-- plaque -->
  <rect x="350" y="340" width="100" height="40" fill="#0f1d2e"/>
  <text x="400" y="365" text-anchor="middle" font-family="Manrope, system-ui" font-size="11" fill="#bfd9ee" font-weight="700">ОСНОВАТЕЛЯМ</text>
</svg>
