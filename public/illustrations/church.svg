<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img">
  <defs>
    <linearGradient id="skyC" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e6f0f8"/>
      <stop offset="100%" stop-color="#d3e6f3"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#skyC)"/>
  <!-- trees -->
  <g fill="#5b8a64" opacity="0.7">
    <circle cx="120" cy="360" r="40"/>
    <circle cx="170" cy="370" r="30"/>
    <circle cx="680" cy="360" r="40"/>
    <circle cx="630" cy="370" r="30"/>
  </g>
  <!-- ground -->
  <rect x="0" y="380" width="800" height="120" fill="#e9e3d6"/>
  <!-- path -->
  <polygon points="300,500 500,500 460,400 340,400" fill="#f4f1ea"/>
  <!-- nave -->
  <rect x="300" y="240" width="200" height="150" fill="#fbfaf6" stroke="#0f1d2e" stroke-opacity="0.15"/>
  <!-- apse on right -->
  <path d="M500 260 Q 540 290 540 340 Q 540 380 500 390 Z" fill="#fbfaf6" stroke="#0f1d2e" stroke-opacity="0.15"/>
  <!-- drum -->
  <rect x="360" y="180" width="80" height="60" fill="#fbfaf6" stroke="#0f1d2e" stroke-opacity="0.15"/>
  <!-- dome -->
  <path d="M360 180 Q 400 110 440 180 Z" fill="#4d9bd4"/>
  <!-- cross -->
  <g stroke="#0f1d2e" stroke-width="3" fill="none">
    <line x1="400" y1="100" x2="400" y2="140"/>
    <line x1="386" y1="114" x2="414" y2="114"/>
  </g>
  <!-- bell tower -->
  <rect x="220" y="220" width="60" height="170" fill="#fbfaf6" stroke="#0f1d2e" stroke-opacity="0.15"/>
  <rect x="232" y="240" width="36" height="40" fill="#bfd9ee"/>
  <path d="M220 220 L280 220 L250 190 Z" fill="#4d9bd4"/>
  <g stroke="#0f1d2e" stroke-width="2" fill="none">
    <line x1="250" y1="170" x2="250" y2="190"/>
    <line x1="242" y1="178" x2="258" y2="178"/>
  </g>
  <!-- door -->
  <rect x="386" y="330" width="28" height="60" fill="#1f3a56"/>
  <rect x="320" y="300" width="20" height="60" fill="#bfd9ee"/>
  <rect x="460" y="300" width="20" height="60" fill="#bfd9ee"/>
</svg>
