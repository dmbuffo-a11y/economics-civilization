  <rect x="260" y="200" width="280" height="40" fill="#0f1d2e"/>
  <text x="400" y="227" text-anchor="middle" font-family="Manrope, system-ui" font-size="20" fill="#fbfaf6" font-weight="700">АВИАЦИОННАЯ</text>
  <!-- train -->
  <g transform="translate(420 310)">
    <rect x="0" y="0" width="340" height="56" rx="6" fill="#1f3a56"/>
    <rect x="10" y="10" width="30" height="22" fill="#bfd9ee"/>
    <rect x="50" y="10" width="30" height="22" fill="#bfd9ee"/>
    <rect x="90" y="10" width="30" height="22" fill="#bfd9ee"/>
    <rect x="130" y="10" width="30" height="22" fill="#bfd9ee"/>
    <rect x="170" y="10" width="30" height="22" fill="#bfd9ee"/>
    <rect x="210" y="10" width="30" height="22" fill="#bfd9ee"/>
    <rect x="250" y="10" width="30" height="22" fill="#bfd9ee"/>
    <circle cx="30" cy="60" r="8" fill="#0f1d2e"/>
    <circle cx="300" cy="60" r="8" fill="#0f1d2e"/>
    <rect x="310" y="6" width="22" height="44" fill="#4d9bd4"/>
