<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img">
  <defs>
    <linearGradient id="skyT" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e6f0f8"/>
      <stop offset="100%" stop-color="#d3e6f3"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#skyT)"/>
  <!-- far buildings -->
  <g fill="#1f3a56" opacity="0.35">
    <rect x="40" y="220" width="80" height="160"/>
    <rect x="130" y="240" width="60" height="140"/>
    <rect x="620" y="230" width="100" height="150"/>
  </g>
  <!-- platform -->
  <rect x="0" y="360" width="800" height="30" fill="#e9e3d6"/>
  <rect x="0" y="390" width="800" height="6" fill="#c9c1ad"/>
  <!-- tracks -->
  <rect x="0" y="410" width="800" height="70" fill="#dcd3c0"/>
  <g stroke="#6a5b42">
    <line x1="0" y1="420" x2="800" y2="420" stroke-width="3"/>
    <line x1="0" y1="460" x2="800" y2="460" stroke-width="3"/>
  </g>
  <g stroke="#8a6a45" stroke-width="2">
    <line x1="40" y1="418" x2="40" y2="462"/>
    <line x1="100" y1="418" x2="100" y2="462"/>
    <line x1="160" y1="418" x2="160" y2="462"/>
    <line x1="220" y1="418" x2="220" y2="462"/>
    <line x1="280" y1="418" x2="280" y2="462"/>
    <line x1="340" y1="418" x2="340" y2="462"/>
    <line x1="400" y1="418" x2="400" y2="462"/>
    <line x1="460" y1="418" x2="460" y2="462"/>
    <line x1="520" y1="418" x2="520" y2="462"/>
    <line x1="580" y1="418" x2="580" y2="462"/>
    <line x1="640" y1="418" x2="640" y2="462"/>
    <line x1="700" y1="418" x2="700" y2="462"/>
    <line x1="760" y1="418" x2="760" y2="462"/>
  </g>
  <!-- canopy -->
  <rect x="100" y="170" width="600" height="10" fill="#1f3a56"/>
  <rect x="110" y="180" width="580" height="6" fill="#0f1d2e"/>
  <rect x="140" y="186" width="4" height="170" fill="#1f3a56"/>
  <rect x="360" y="186" width="4" height="170" fill="#1f3a56"/>
  <rect x="580" y="186" width="4" height="170" fill="#1f3a56"/>
