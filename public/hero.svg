<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" role="img" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="heroSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eaf2f9"/>
      <stop offset="60%" stop-color="#c9dfee"/>
      <stop offset="100%" stop-color="#b1cee4"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="800" fill="url(#heroSky)"/>
  <!-- distant clouds -->
  <g opacity="0.85">
    <ellipse cx="180" cy="160" rx="160" ry="20" fill="#fff"/>
    <ellipse cx="260" cy="180" rx="120" ry="16" fill="#fff"/>
    <ellipse cx="900" cy="110" rx="180" ry="22" fill="#fff"/>
    <ellipse cx="1380" cy="220" rx="200" ry="24" fill="#fff"/>
    <ellipse cx="700" cy="260" rx="120" ry="14" fill="#fff"/>
  </g>
  <!-- horizon strip -->
  <rect x="0" y="560" width="1600" height="40" fill="#f4f1ea" opacity="0.6"/>
  <!-- forest horizon -->
  <g fill="#5b8a64" opacity="0.55">
    <polygon points="0,560 60,500 120,560"/>
    <polygon points="100,565 180,490 260,565"/>
    <polygon points="240,570 320,500 400,570"/>
    <polygon points="380,565 460,510 540,565"/>
    <polygon points="540,570 620,500 700,570"/>
    <polygon points="700,565 780,510 860,565"/>
    <polygon points="860,570 940,495 1020,570"/>
    <polygon points="1020,565 1100,510 1180,565"/>
    <polygon points="1180,570 1260,500 1340,570"/>
    <polygon points="1340,565 1420,510 1500,565"/>
    <polygon points="1500,570 1580,505 1660,570"/>
  </g>
  <!-- ground -->
  <rect x="0" y="590" width="1600" height="210" fill="#efe9db"/>
  <!-- runway stripes -->
  <g stroke="#0f1d2e" stroke-opacity="0.18" stroke-width="2">
    <line x1="0" y1="640" x2="1600" y2="640"/>
  </g>
  <g fill="#fbfaf6">
    <rect x="40" y="636" width="60" height="8"/>
    <rect x="160" y="636" width="60" height="8"/>
    <rect x="280" y="636" width="60" height="8"/>
    <rect x="400" y="636" width="60" height="8"/>
    <rect x="520" y="636" width="60" height="8"/>
    <rect x="640" y="636" width="60" height="8"/>
    <rect x="760" y="636" width="60" height="8"/>
    <rect x="880" y="636" width="60" height="8"/>
    <rect x="1000" y="636" width="60" height="8"/>
    <rect x="1120" y="636" width="60" height="8"/>
    <rect x="1240" y="636" width="60" height="8"/>
    <rect x="1360" y="636" width="60" height="8"/>
    <rect x="1480" y="636" width="60" height="8"/>
  </g>
  <!-- buildings silhouette (Aviagorodok) -->
  <g fill="#1f3a56" opacity="0.85">
    <rect x="70" y="460" width="80" height="140"/>
    <rect x="160" y="440" width="60" height="160"/>
    <rect x="230" y="470" width="90" height="130"/>
    <rect x="330" y="430" width="70" height="170"/>
    <rect x="410" y="450" width="100" height="150"/>
