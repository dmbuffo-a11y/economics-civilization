  <!-- plane climbing -->
  <g transform="translate(820 260) rotate(-10)">
    <path d="M0 40 L260 0 L250 28 L130 44 L100 90 L80 90 L110 44 Z" fill="#0f1d2e"/>
    <circle cx="258" cy="-4" r="5" fill="#4d9bd4"/>
    <!-- contrail -->
    <path d="M-240 110 Q -120 80 0 50" fill="none" stroke="#fff" stroke-opacity="0.7" stroke-width="6" stroke-linecap="round"/>
  </g>
