    <rect x="82" y="490" width="10" height="10"/><rect x="100" y="490" width="10" height="10"/><rect x="118" y="490" width="10" height="10"/>
    <rect x="82" y="510" width="10" height="10"/><rect x="100" y="510" width="10" height="10"/><rect x="118" y="510" width="10" height="10"/>
    <rect x="170" y="450" width="8" height="10"/><rect x="188" y="450" width="8" height="10"/><rect x="206" y="450" width="8" height="10"/>
    <rect x="170" y="470" width="8" height="10"/><rect x="188" y="470" width="8" height="10"/><rect x="206" y="470" width="8" height="10"/>
    <rect x="170" y="490" width="8" height="10"/><rect x="188" y="490" width="8" height="10"/><rect x="206" y="490" width="8" height="10"/>
    <rect x="170" y="510" width="8" height="10"/><rect x="188" y="510" width="8" height="10"/><rect x="206" y="510" width="8" height="10"/>
    <rect x="340" y="444" width="10" height="10"/><rect x="360" y="444" width="10" height="10"/><rect x="380" y="444" width="10" height="10"/>
    <rect x="340" y="464" width="10" height="10"/><rect x="360" y="464" width="10" height="10"/><rect x="380" y="464" width="10" height="10"/>
    <rect x="340" y="484" width="10" height="10"/><rect x="360" y="484" width="10" height="10"/><rect x="380" y="484" width="10" height="10"/>
    <rect x="340" y="504" width="10" height="10"/><rect x="360" y="504" width="10" height="10"/><rect x="380" y="504" width="10" height="10"/>
    <rect x="420" y="460" width="12" height="10"/><rect x="442" y="460" width="12" height="10"/><rect x="464" y="460" width="12" height="10"/><rect x="486" y="460" width="12" height="10"/>
    <rect x="420" y="482" width="12" height="10"/><rect x="442" y="482" width="12" height="10"/><rect x="464" y="482" width="12" height="10"/><rect x="486" y="482" width="12" height="10"/>
    <rect x="420" y="504" width="12" height="10"/><rect x="442" y="504" width="12" height="10"/><rect x="464" y="504" width="12" height="10"/><rect x="486" y="504" width="12" height="10"/>
  </g>
  <!-- terminal on the right -->
  <g fill="#0f1d2e" opacity="0.85">
    <rect x="1100" y="520" width="440" height="80"/>
    <rect x="1140" y="500" width="60" height="20"/>
    <rect x="1260" y="495" width="100" height="25"/>
    <rect x="1400" y="505" width="80" height="15"/>
