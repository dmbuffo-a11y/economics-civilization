<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img">
  <rect width="800" height="500" fill="#f4f1ea"/>
  <!-- floor -->
  <rect x="0" y="420" width="800" height="80" fill="#e9e3d6"/>
  <!-- back wall -->
  <rect x="0" y="0" width="800" height="420" fill="#fbfaf6"/>
  <!-- plane silhouette on wall -->
  <g transform="translate(140 140)" fill="#1f3a56" opacity="0.85">
    <path d="M0 40 L360 10 L340 50 L150 56 L120 92 L100 92 L130 56 Z"/>
    <circle cx="352" cy="4" r="6" fill="#4d9bd4"/>
    <path d="M120 56 L80 90 L90 56 Z" fill="#1f3a56"/>
  </g>
  <!-- poster -->
  <rect x="560" y="120" width="160" height="220" fill="#0f1d2e"/>
  <rect x="572" y="132" width="136" height="120" fill="#bfd9ee"/>
  <text x="640" y="290" text-anchor="middle" font-family="Manrope, system-ui" font-size="14" fill="#fbfaf6" font-weight="700">DME 1965</text>
  <text x="640" y="314" text-anchor="middle" font-family="Manrope, system-ui" font-size="10" fill="#bfd9ee">музей аэропорта</text>
  <!-- vitrines -->
  <g>
    <rect x="120" y="320" width="160" height="100" fill="#fff" stroke="#0f1d2e" stroke-opacity="0.15"/>
    <rect x="130" y="330" width="140" height="80" fill="#e6f0f8"/>
    <rect x="170" y="350" width="18" height="40" fill="#1f3a56"/>
    <rect x="200" y="360" width="24" height="30" fill="#4d9bd4"/>
    <rect x="235" y="345" width="18" height="45" fill="#1f3a56"/>
  </g>
  <g>
    <rect x="320" y="320" width="160" height="100" fill="#fff" stroke="#0f1d2e" stroke-opacity="0.15"/>
    <rect x="330" y="330" width="140" height="80" fill="#e6f0f8"/>
    <circle cx="400" cy="370" r="22" fill="#0f1d2e"/>
    <circle cx="400" cy="370" r="8" fill="#bfd9ee"/>
  </g>
  <!-- visitor silhouette -->
  <g transform="translate(500 330)" fill="#1f3a56" opacity="0.7">
    <circle cx="12" cy="10" r="10"/>
    <rect x="2" y="22" width="24" height="60" rx="6"/>
  </g>
</svg>
